<html lang="ko">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://asia-northeast3-warehouse-inventory-84fef.cloudfunctions.net; frame-src https://warehouse-inventory-84fef.firebaseapp.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta charset="utf-8">

<body class="inventory-locked">

<title>지하 구획도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body.inventory-locked #panelPlan,body.inventory-locked #panelStock,body.inventory-locked .tabs,body.inventory-locked #statsRow{display:none!important}
  :root{
    --radius-sm:8px;
    --radius-md:10px;
    --radius-lg:14px;
    --radius-xl:18px;
    --bg:#fafafa;
    --bg-grid:#f4f4f5;
    --panel:#ffffff;
    --panel-raised:#ffffff;
    --line:#27272a;
    --wall:#18181b;
    --pallet:#f4f4f5;
    --pallet-line:#b4b4bb;
    --text:#18181b;
    --muted:#6e6e76;
    --border:#e7e7ea;
    --hairline:#f1f1f3;
    --accent:#0071e3;
    --accent-strong:#005bb8;
    --accent-weak:#eaf3ff;
    --danger:#d0342c;
    --warn:#b3630a;
    /* category tints -- 제품 and 기계팀 are the exact PANTONE swatches (297 C and 13-0643 TCX
       Yellow Plum); 부자재/샘플 sit 30% down in saturation so they stay behind those two. */
    --cat-product:#71c5e8;
    --cat-machine:#d5d859;
    --cat-pack:#d3d5da;
    --cat-sample:#f4d6e7;
    --shadow-sm:0 1px 2px rgba(15,15,20,.05);
    --shadow:0 6px 20px -8px rgba(15,15,20,.10);
    --shadow-lg:0 28px 64px -20px rgba(15,15,20,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0b0c;
      --bg-grid:#111113;
      --panel:#111113;
      --panel-raised:#19191c;
      --line:#d4d4d8;
      --wall:#f4f4f5;
      --pallet:#1e1e22;
      --pallet-line:#57575f;
      --text:#f2f2f3;
      --muted:#93939c;
      --border:#28282c;
      --hairline:#1f1f23;
      --accent:#3b9dff;
      --accent-strong:#0a6fd1;
      --accent-weak:#12314f;
      --cat-product:#104961;
      --cat-machine:#525313;
      --cat-pack:#3c4045;
      --cat-sample:#442a38;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 6px 20px -8px rgba(0,0,0,.4);
      --shadow-lg:0 28px 64px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0c;
    --bg-grid:#111113;
    --panel:#111113;
    --panel-raised:#19191c;
    --line:#d4d4d8;
    --wall:#f4f4f5;
    --pallet:#1e1e22;
    --pallet-line:#57575f;
    --text:#f2f2f3;
    --muted:#93939c;
    --border:#28282c;
    --hairline:#1f1f23;
    --accent:#3b9dff;
    --accent-strong:#0a6fd1;
    --accent-weak:#12314f;
    --danger:#f2857a;
    --warn:#e0a44a;
    --cat-product:#104961;
    --cat-machine:#525313;
    --cat-pack:#3c4045;
    --cat-sample:#442a38;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 6px 20px -8px rgba(0,0,0,.4);
    --shadow-lg:0 28px 64px -20px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .num{ font-family:"IBM Plex Mono","Noto Sans KR",monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:1560px; margin:0 auto; padding:56px 40px 80px; }

  header{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:36px; padding-bottom:28px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .mark{ width:30px; height:30px; border-radius:8px; background:var(--accent-weak); border:none; display:flex; align-items:center; justify-content:center; flex:none; color:var(--accent); }
  .mark svg{ width:17px; height:17px; }
  .titles h1{ font-size:19px; font-weight:600; margin:0 0 2px; letter-spacing:-0.02em; }
  .titles p{ font-size:13px; color:var(--muted); margin:0; }

  .stats{ display:flex; gap:0; flex-wrap:wrap; align-self:center; }
  .stat-chip{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; padding:2px 0 2px 28px; }
  .stat-chip b{ font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  .stat-chip span{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; }
  .stat-chip-warn b{ color:var(--danger); }
  .stat-chip-btn{ appearance:none; background:none; border:none; font:inherit; cursor:default; }
  .stat-chip-btn:not(:disabled){ cursor:pointer; }
  .stat-chip-btn:not(:disabled):hover b{ text-decoration:underline; }

  .legend{ display:flex; gap:22px; flex-wrap:wrap; margin-bottom:22px; padding:2px; }
  .legend-chip{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .match-warn{ display:flex; align-items:flex-start; gap:8px; background:var(--panel-raised); border:1px solid var(--warn); border-left:4px solid var(--warn); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:var(--text); line-height:1.5; }
  .match-warn[hidden]{ display:none; }
  .swatch{ width:13px; height:13px; border-radius:3px; display:inline-block; flex:none; }
  .sw-wall{ background:var(--wall); }
  .sw-shelf{ background:var(--panel-raised); border:1.5px solid var(--line); box-sizing:border-box; }
  .sw-pallet{ background:var(--pallet); border:1px solid var(--pallet-line); box-sizing:border-box; }
  .sw-cat{ display:inline-flex; gap:3px; }
  .sw-cat i{ width:10px; height:13px; border-radius:2px; display:inline-block; }
  .sw-door{ background:none; border:1.5px solid var(--line); border-radius:50%; clip-path:inset(50% 0 0 50%); box-sizing:border-box; }

  .frame{ position:relative; background-color:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; overflow:hidden; box-shadow:var(--shadow-sm); }
  .frame-inner{ overflow-x:auto; border-radius:6px; }
  svg{ display:block; width:100%; height:auto; min-width:1000px; }
  #planSvg text{ font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; fill:var(--text); }
  .shelf-rect{ cursor:pointer; transition:fill .15s ease, stroke .15s ease, filter .15s ease; }
  .shelf-rect{ transition:fill .12s ease, stroke .12s ease; }
  .shelf-rect:hover{ fill:var(--accent-weak); stroke:var(--accent); stroke-width:2.4; }
  /* pointer-down feedback is instant, not deferred to click -- no transform here since SVG
     transform-origin sits at the viewBox corner, not the shape's own center */
  .shelf-rect:active{ fill:var(--accent-weak); stroke:var(--accent-strong); stroke-width:3.2; }
  .shelf-rect:focus{ outline:none; }
  .shelf-rect:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .hint{ font-size:12.5px; color:var(--muted); margin:16px 2px 0; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,15,18,.4); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-backdrop[hidden]{ display:none; }
  .modal{ background:var(--panel-raised); border-radius:var(--radius-xl); width:min(640px,96vw); max-height:86vh; overflow:auto; box-shadow:var(--shadow-lg); border:1px solid var(--border); animation:modal-in .18s cubic-bezier(.2,.8,.2,1); }
  @keyframes modal-in{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
  /* closing plays the same path backwards (enter/exit symmetry) instead of the backdrop just vanishing */
  .modal-backdrop.closing{ animation:backdrop-out .16s ease forwards; }
  .modal-backdrop.closing .modal{ animation:modal-out .16s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes backdrop-out{ to{ opacity:0; } }
  @keyframes modal-out{ to{ opacity:0; transform:translateY(8px) scale(.98); } }
  @media (prefers-reduced-motion: reduce){
    .modal{ animation:none; }
    .modal-backdrop.closing, .modal-backdrop.closing .modal{ animation:none; }
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:24px 26px 6px; }
  .modal-head h2{ font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .modal-close{ appearance:none; border:none; background:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:6px 8px; border-radius:var(--radius-sm); transition:background .12s ease, color .12s ease, transform .1s ease; }
  .modal-close:hover{ background:var(--hairline); color:var(--text); }
  .modal-close:active{ transform:scale(.92); }
  .modal-body{ padding:14px 26px 24px; }
  /* labels + every item row are flattened (display:contents) into ONE grid on #itemScroll, so
     the browser sizes each column from every row's cells together -- if each row kept its own
     grid, an <input>'s intrinsic width vs. a label <span>'s could resolve the shared 1fr column
     to different pixel widths per row and throw the columns out of alignment. */
  #itemScroll{ overflow-x:auto; padding-bottom:2px; display:grid; grid-template-columns: minmax(120px,1fr) 64px 64px 150px 112px 32px; gap:10px; align-items:center; }
  .col-labels{ display:contents; }
  #itemRows{ display:contents; }
  .item-row{ display:contents; }
  .item-row input{ min-width:0; width:100%; box-sizing:border-box; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:14px; transition:border-color .12s ease, box-shadow .12s ease; }
  .item-row input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .item-row input[type="date"]{ font-size:13px; color-scheme:light dark; }
  .item-row input.qty-input{ font-family:"IBM Plex Mono","Noto Sans KR",monospace; }
  .item-row button{ appearance:none; border:1px solid var(--border); background:var(--bg); color:var(--muted); width:32px; height:32px; border-radius:var(--radius-sm); cursor:pointer; font-size:16px; flex:none; transition:color .12s ease, border-color .12s ease, transform .1s ease; }
  .item-row button:hover{ color:var(--danger); border-color:var(--danger); }
  .item-row button:active{ transform:scale(.9); }
  .add-row{ appearance:none; border:1px dashed var(--border); background:none; color:var(--muted); padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:500; width:100%; margin-top:4px; transition:color .12s ease, border-color .12s ease, background .12s ease, transform .1s ease; }
  .add-row:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-weak); }
  .add-row:active{ transform:scale(.98); }
  .modal-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 26px 26px; border-top:1px solid var(--hairline); margin-top:8px; }
  .save-state{ font-size:12.5px; color:var(--muted); }
  .save-btn{ appearance:none; border:none; background:var(--accent-strong); color:#fff; font-weight:600; font-size:14px; padding:10px 22px; border-radius:var(--radius-sm); cursor:pointer; transition:filter .12s ease, transform .08s ease; }
  .save-btn:hover{ filter:brightness(1.08); }
  .save-btn:active{ transform:scale(.96); }
  .save-btn:disabled{ opacity:.5; cursor:default; }
  .col-labels span{ font-size:11.5px; font-weight:600; letter-spacing:.03em; color:var(--muted); text-transform:uppercase; }
  /* single-cell mode has exactly one row and its own 비우기 button, so the per-row delete is
     redundant there -- hidden rather than removed so the grid columns still line up. */
  #itemRows[data-mode="cell"] .item-row > button{ visibility:hidden; }
  .foot-actions{ display:flex; align-items:center; gap:10px; }
  .clear-btn{ appearance:none; border:1px solid var(--border); background:none; color:var(--muted); font-size:13px; font-weight:500; padding:10px 16px; border-radius:var(--radius-sm); cursor:pointer; transition:color .12s ease, border-color .12s ease, transform .1s ease; }
  .clear-btn:hover{ color:var(--danger); border-color:var(--danger); }
  .clear-btn:active{ transform:scale(.96); }

  /* ---- tabs ---- */
  .tabs{ display:flex; gap:4px; margin:0 0 24px; border-bottom:1px solid var(--hairline); }
  .tab{ appearance:none; background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; padding:10px 16px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:color .12s ease, border-color .12s ease; }
  .tab:hover{ color:var(--text); }
  .tab[aria-selected="true"]{ color:var(--text); border-bottom-color:var(--accent); }

  /* ---- 재고 현황 tab ---- */
  .stock-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .stock-bar input[type="search"]{ flex:1 1 200px; max-width:300px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--panel-raised); color:var(--text); font-size:13.5px; font-family:inherit; }
  .stock-bar input[type="search"]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .stock-toggle{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; }
  .stock-summary{ margin-left:auto; font-size:12.5px; color:var(--muted); }
  .filter-chip{ appearance:none; display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; border:1px solid var(--danger); background:none; color:var(--danger); font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; }
  .filter-chip:hover{ filter:brightness(1.1); }
  .filter-chip[aria-pressed="true"]{ background:var(--danger); color:#fff; }

  .stock-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; align-items:start; }
  .stock-card{ border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--panel-raised); overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .2s ease, border-color .2s ease; }
  .stock-card.flash{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .stock-card.is-empty{ opacity:.7; }
  .stock-tint{ height:3px; background:var(--border); }
  .stock-head{ display:flex; align-items:center; gap:10px; padding:14px 16px 12px; }
  .stock-head b{ font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .stock-head .n{ font-size:11.5px; color:var(--muted); }
  .stock-head .spacer{ margin-left:auto; }
  .col-step{ display:inline-flex; align-items:center; gap:2px; }
  .col-step button{ appearance:none; width:24px; height:24px; border:1px solid var(--border); background:var(--bg); color:var(--muted); border-radius:6px; cursor:pointer; font-size:13px; line-height:1; transition:color .12s ease, border-color .12s ease, transform .1s ease; }
  .col-step button:hover:not(:disabled){ color:var(--accent); border-color:var(--accent); }
  .col-step button:active:not(:disabled){ transform:scale(.88); }
  .col-step button:disabled{ opacity:.35; cursor:default; }
  .col-step span{ min-width:46px; text-align:center; font-size:11.5px; color:var(--muted); }

  .cell-scroll{ overflow-x:auto; border-top:1px solid var(--hairline); padding:14px 16px 16px; }
  .cell-grid{ display:grid; gap:7px; min-width:max-content; }
  .cell{ appearance:none; text-align:left; font-family:inherit; display:flex; flex-direction:column; gap:2px; min-width:94px; min-height:64px; padding:7px 8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); cursor:pointer; transition:border-color .12s ease, background .12s ease, transform .1s ease; }
  .cell:hover{ border-color:var(--accent); background:var(--accent-weak); }
  .cell:active{ transform:scale(.96); }
  .cell.empty{ border-style:dashed; align-items:center; justify-content:center; color:var(--muted); font-size:16px; }
  .cell .pos{ font-size:10.5px; letter-spacing:.04em; color:var(--muted); font-family:"IBM Plex Mono","Noto Sans KR",monospace; }
  /* a cell can hold several products -- each gets its own block, separated by a hairline */
  .cell .cell-item{ display:flex; flex-direction:column; gap:1px; }
  .cell .cell-item + .cell-item{ margin-top:4px; padding-top:4px; border-top:1px dashed var(--border); }
  .cell .nm{ font-size:12.5px; font-weight:600; line-height:1.3; word-break:break-all; }
  .cell .sub{ font-size:11px; color:var(--muted); font-family:"IBM Plex Mono","Noto Sans KR",monospace; }
  .cell .exp-warn{ color:var(--warn); font-weight:600; }
  .cell .exp-over{ color:var(--danger); font-weight:600; }
  .stock-low{ color:var(--danger); font-weight:600; }

  .list-items{ border-top:1px solid var(--hairline); }
  .list-item{ display:flex; align-items:baseline; gap:10px; padding:9px 16px; border-bottom:1px solid var(--hairline); font-size:13px; }
  .list-item:last-child{ border-bottom:none; }
  .list-item .sub{ margin-left:auto; font-size:11px; color:var(--muted); font-family:"IBM Plex Mono","Noto Sans KR",monospace; }
  .list-empty{ padding:13px 16px; font-size:12.5px; color:var(--muted); border-top:1px solid var(--hairline); }
  .edit-link{ appearance:none; border:1px solid var(--border); background:none; color:var(--muted); font-family:inherit; font-size:11.5px; padding:5px 10px; border-radius:6px; cursor:pointer; transition:color .12s ease, border-color .12s ease, transform .1s ease; }
  .edit-link:hover{ color:var(--accent); border-color:var(--accent); }
  .edit-link:active{ transform:scale(.94); }
  .stock-blank{ padding:64px 16px; text-align:center; font-size:13.5px; color:var(--muted); border:1px dashed var(--border); border-radius:var(--radius-lg); }

  /* ---- admin login ---- */
  .auth-box{ display:flex; align-items:center; gap:10px; align-self:center; font-size:12.5px; color:var(--muted); }
  .auth-link{ appearance:none; border:1px solid var(--border); background:none; color:var(--muted); font-family:inherit; font-size:12.5px; padding:7px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:color .12s ease, border-color .12s ease; }
  .auth-link:hover{ color:var(--accent); border-color:var(--accent); }
  .login-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .login-field label{ font-size:12.5px; color:var(--muted); }
  .login-field input{ padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); color:var(--text); font-size:14px; }
  .login-field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .login-error{ font-size:12.5px; color:var(--danger); min-height:1em; margin-bottom:10px; }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="titles">
        <h1>지하 구획도</h1>
        <p>지하 창고 재고 관리 도면</p>
      </div>
    </div>
    <div class="stats" id="statsRow"></div>
    <div class="auth-box" id="authBox"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabPlan" type="button" role="tab" aria-selected="true" aria-controls="panelPlan">구획도</button>
    <button class="tab" id="tabStock" type="button" role="tab" aria-selected="false" aria-controls="panelStock">재고 현황</button>
  </div>

  <div id="panelPlan" role="tabpanel" aria-labelledby="tabPlan">
  <div class="match-warn" id="matchWarnBanner" role="status" hidden></div>
  <div class="legend">
    <span class="legend-chip"><i class="swatch sw-wall"></i>벽</span>
    <span class="legend-chip"><i class="swatch sw-shelf"></i>선반</span>
    <span class="legend-chip"><i class="swatch sw-pallet"></i>팔레트</span>
    <span class="legend-chip"><i class="swatch sw-door"></i>문</span>
    <span class="legend-chip"><span class="sw-cat"><i style="background:var(--cat-product)"></i><i style="background:var(--cat-machine)"></i><i style="background:var(--cat-pack)"></i><i style="background:var(--cat-sample)"></i></span>구역 구분</span>
  </div>

  <div class="frame">
    <div class="frame-inner">
      <svg id="planSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <p class="hint">선반을 클릭하면 재고 현황 탭의 해당 칸 배치도로 이동해요. 팔레트는 바로 제품을 등록·수정할 수 있어요.</p>
  </div>

  <div id="panelStock" role="tabpanel" aria-labelledby="tabStock" hidden>
